<title>قرارات منصة التكافل</title>

<style>
/* Layout: header, module tabs, then a 4-column grid of compact decision cards (2 on tablets, 1 on phones). RTL. Colors from takafuly.com. */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --ink:#25282b; --muted:#6f7478; --line:#dfe2e6;
  --blue:#0f75db; --blue-deep:#284dae; --navy:#152b56; --blue-soft:#e3eefb; --accent:#ff5722; --accent-soft:#ffe9e2;
  --f:"Almarai",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1830; --surface:#152b56; --ink:#eef2fb; --muted:#aab4c8; --line:#26407a;
  --blue:#5aa6f2; --blue-deep:#8fb0ff; --navy:#eef2fb; --blue-soft:#1d3a72; --accent:#ff8a63; --accent-soft:#4a2a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1830; --surface:#152b56; --ink:#eef2fb; --muted:#aab4c8; --line:#26407a;
  --blue:#5aa6f2; --blue-deep:#8fb0ff; --navy:#eef2fb; --blue-soft:#1d3a72; --accent:#ff8a63; --accent-soft:#4a2a24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.7;direction:rtl}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:grid;gap:2px}
.brand small{color:var(--blue);font-weight:700;font-size:.8rem}
h1{font-size:1.45rem;color:var(--navy)}
.lede{margin:0;color:var(--muted);font-size:.9rem}
.prog{display:grid;gap:6px;min-width:240px}
.prog b{font-size:1rem;color:var(--navy);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue)}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.tab small{color:var(--muted);margin-inline-start:6px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.tab[aria-selected="true"] small{color:#e3eefb}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.82rem;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.tools input{flex:1 1 200px;min-width:0;font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-size:.8rem;padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.modhead{display:grid;gap:6px;margin-bottom:12px}
.modhead h2{font-size:1.15rem;color:var(--navy)}
.modhead p{margin:0;color:var(--muted);font-size:.88rem;max-width:90ch}
.more{display:flex;flex-wrap:wrap;gap:8px}
.more details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:.85rem;flex:1 1 300px;min-width:0}
.more summary{cursor:pointer;font-weight:700;color:var(--blue-deep)}
.more ul{margin:6px 0;padding-inline-start:18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0}
.card.done{border-color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.card.disc{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.72rem;color:var(--muted)}
.id{direction:ltr;font-family:ui-monospace,monospace;color:var(--muted)}
.prio{display:inline-flex;align-items:center;gap:4px}
.prio::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.prio.crit{color:var(--accent);font-weight:700}.prio.crit::before{background:var(--accent)}
.prio.imp{color:var(--blue-deep)}.prio.imp::before{background:var(--blue-deep)}
.card h3{font-size:.95rem;color:var(--navy)}
.q{margin:0;font-size:.88rem}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:5px;accent-color:var(--blue)}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.opt b{font-size:.84rem;font-weight:700}
.opt .con{display:block;font-size:.76rem;color:var(--muted)}
.rec{display:inline-block;font-size:.68rem;color:#fff;background:var(--blue-deep);border-radius:4px;padding:0 5px;margin-inline-start:4px;vertical-align:middle}
.card details{font-size:.8rem}
.card summary{cursor:pointer;color:var(--blue-deep);font-weight:700}
.card details p,.card details ul{margin:4px 0}
.card details ul{padding-inline-start:16px}
.lbl{font-weight:700;color:var(--ink)}
.en{direction:ltr;unicode-bidi:isolate}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card textarea{font:inherit;font-size:.8rem;width:100%;min-height:46px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);resize:vertical}
.who{font-size:.72rem;color:var(--muted)}
.empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.toast{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>

<div class="wrap">
  <header>
    <div class="brand">

      <h1>قرارات المنصة</h1>

  </div>
  <section id="mod" aria-live="polite"></section>
</div>

<script>
(function(){
  const RAW = JSON.parse(document.getElementById('data').textContent);
  const ORDER = ['GOV','PLT','DIC','M02','M03','M05','M06','M07','M09','M04','M10','M08','M12','RES','M16','M11','M15','M33','M34','M28'];
  const mods = [];
  RAW.groups.forEach(g => (g.modules||[]).forEach(m => mods.push(m)));
  mods.sort((a,b) => { const ia = ORDER.indexOf(a.id), ib = ORDER.indexOf(b.id); return (ia<0?99:ia)-(ib<0?99:ib); });
  const decisions = []; mods.forEach(m => (m.decisions||[]).forEach(d => decisions.push(Object.assign({mod:m}, d))));

  let answers = {}, db = null, user = null, myId = null, readOnly = false;
  let cur = mods[0] && mods[0].id, filt = '';
  const LS = 'tt-decisions-local', LSM = 'tt-decisions-mod';
  try { const s = localStorage.getItem(LSM); if (s && mods.some(m => m.id === s)) cur = s; } catch(e){}
  try { answers = JSON.parse(localStorage.getItem(LS) || '{}'); } catch(e){ answers = {}; }
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(answers)); } catch(e){} };

  const $ = s => document.querySelector(s);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const status = id => { const a = answers[id]; if (!a) return 'open'; if (a.status === 'discuss') return 'discuss'; return a.choice ? 'answered' : 'open'; };
  const norm = s => (s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').toLowerCase();
  function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2000); }

  // English terms inside Arabic text read left-to-right
  function rich(node, text){
    (text||'').split(/([A-Za-z][A-Za-z0-9 .,&/+()%-]*[A-Za-z0-9)%])/).forEach((part, i) => {
      if (!part) return; if (i % 2) { const s = el('span','en',part); node.appendChild(s); } else node.appendChild(document.createTextNode(part));
    });
    return node;
  }

  function tabs(){
    const box = $('#tabs'); box.textContent = '';
    mods.forEach(m => {
      const ds = m.decisions||[]; const n = ds.filter(d => status(d.id)==='answered').length;
      const b = el('button','tab'); b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', String(m.id===cur));
      b.appendChild(rich(el('span'), m.name_ar)); b.appendChild(el('small', null, n + '/' + ds.length));
      b.addEventListener('click', () => { cur = m.id; try { localStorage.setItem(LSM, cur); } catch(e){} $('#q').value=''; draw(); });
      box.appendChild(b);
    });
  }

  function progress(){
    const total = decisions.length, done = decisions.filter(d => status(d.id)==='answered').length;
    const crit = decisions.filter(d => d.priority==='حرج' && status(d.id)!=='answered').length;
    $('#progText').textContent = 'اخترتم ' + done + ' من ' + total;
    $('#bar').style.width = (total ? Math.round(done*100/total) : 0) + '%';
    $('#critText').textContent = crit + ' قراراً حرجاً بانتظاركم';
  }

  function card(d){
    const a = answers[d.id] || {}, s = status(d.id);
    const c = el('article','card' + (s==='answered'?' done':s==='discuss'?' disc':''));
    const top = el('div','top');
    top.appendChild(el('span','id', d.id));
    const p = el('span','prio' + (d.priority==='حرج'?' crit':d.priority==='مهم'?' imp':''), d.priority||'عادي'); top.appendChild(p);
    if (d.needed_by_day) top.appendChild(el('span', null, 'قبل اليوم ' + d.needed_by_day));
    if ((d.owner_ar||[]).length) top.appendChild(el('span', null, d.owner_ar.join('، ')));
    c.appendChild(top);
    c.appendChild(rich(el('h3'), d.title_ar));
    c.appendChild(rich(el('p','q'), d.question_ar));
    const opts = el('div','opts'); opts.setAttribute('role','radiogroup'); opts.setAttribute('aria-label', d.title_ar);
    (d.options||[]).forEach(o => {
      const lab = el('label','opt' + (a.choice===o.key?' on':''));
      const r = el('input'); r.type='radio'; r.name='r-'+d.id; r.id='r-'+d.id+'-'+o.key; r.checked = a.choice===o.key;
      r.addEventListener('change', () => save(d.id, {choice:o.key, status:'answered'}, 'حفظنا اختياركم'));
      const body = el('div'); const b = rich(el('b'), o.key + '. ' + o.label_ar); body.appendChild(b);
      if (o.key === d.recommended) body.appendChild(el('span','rec','نوصي به'));
      if (o.consequence_ar) body.appendChild(rich(el('span','con'), o.consequence_ar));
      lab.appendChild(r); lab.appendChild(body); opts.appendChild(lab);
    });
    c.appendChild(opts);
    if (d.context_ar || (d.edge_cases_ar||[]).length || d.recommended_reason_ar){
      const det = el('details'); det.appendChild(el('summary', null, 'التفاصيل'));
      if (d.context_ar) det.appendChild(rich(el('p'), d.context_ar));
      if ((d.edge_cases_ar||[]).length){ const l = el('p','lbl en','Edge cases'); det.appendChild(l); const ul = el('ul'); d.edge_cases_ar.forEach(x => ul.appendChild(rich(el('li'), x))); det.appendChild(ul); }
      if (d.recommended_reason_ar){ const pr = el('p'); pr.appendChild(el('span','lbl','لماذا نوصي به: ')); rich(pr, d.recommended_reason_ar); det.appendChild(pr); }
      c.appendChild(det);
    }
    const ta = el('textarea'); ta.id = 'n-' + d.id; ta.placeholder = 'اكتبوا ملاحظتكم'; ta.value = a.note || ''; ta.hidden = !a.note; ta.setAttribute('aria-label','ملاحظة');
    const acts = el('div','acts');
    const bRec = el('button','btn primary','اعتماد توصيتنا'); bRec.type='button';
    bRec.addEventListener('click', () => save(d.id, {choice:d.recommended, status:'answered'}, 'حفظنا اختياركم'));
    const bNote = el('button','btn', a.note ? 'حفظ الملاحظة' : 'ملاحظة'); bNote.type='button';
    bNote.addEventListener('click', () => { if (ta.hidden){ ta.hidden = false; ta.focus(); bNote.textContent = 'حفظ الملاحظة'; } else save(d.id, {note: ta.value.trim()}, 'حفظنا الملاحظة'); });
    const bDisc = el('button','btn', s==='discuss' ? 'إلغاء النقاش' : 'للنقاش'); bDisc.type='button';
    bDisc.addEventListener('click', () => save(d.id, {status: s==='discuss' ? (a.choice ? 'answered' : 'open') : 'discuss'}, 'حفظنا التغيير'));
    acts.appendChild(bRec); acts.appendChild(bNote); acts.appendChild(bDisc);
    if (answers[d.id]){ const bClr = el('button','btn','مسح'); bClr.type='button'; bClr.addEventListener('click', () => clear(d.id)); acts.appendChild(bClr); }
    c.appendChild(ta); c.appendChild(acts);
    if (a.at){ const w = el('div','who'); w.dataset.by = a.by || ''; w.textContent = (a.choice ? 'اخترتم ' + a.choice + ' · ' : '') + new Date(a.at).toLocaleDateString('ar-LY',{day:'numeric',month:'long'}); c.appendChild(w); }
    return c;
  }

  async function names(root){
    if (!user) return; const ws = [...root.querySelectorAll('.who[data-by]')].filter(w => w.dataset.by); if (!ws.length) return;
    try { const ps = await user.profiles([...new Set(ws.map(w => w.dataset.by))]); ws.forEach(w => { const n = ps[w.dataset.by] && ps[w.dataset.by].name; if (n) w.textContent += ' · ' + n; }); } catch(e){}
  }

  function draw(){
    tabs(); progress();
    const box = $('#mod'); box.textContent = '';
    const q = norm($('#q').value.trim());
    let list, m = mods.find(x => x.id === cur);
    if (q){ list = decisions.filter(d => norm([d.id,d.title_ar,d.question_ar,d.context_ar,(d.options||[]).map(o=>o.label_ar).join(' ')].join(' ')).includes(q)); }
    else {
      list = (m.decisions||[]).map(d => Object.assign({mod:m}, d));
      const h = el('div','modhead'); h.appendChild(rich(el('h2'), m.name_ar)); if (m.summary_ar) h.appendChild(rich(el('p'), m.summary_ar));
      const more = el('div','more');
      const box2 = (title, items) => { if (!items || !items.length) return; const det = el('details'); det.appendChild(el('summary', null, title + ' (' + items.length + ')')); const ul = el('ul'); items.forEach(t => ul.appendChild(rich(el('li'), t))); det.appendChild(ul); more.appendChild(det); };
      box2('قواعد النظام', m.rules_ar); box2('ما أجّلناه', m.deferred_ar);
      h.appendChild(more); box.appendChild(h);
    }
    if (filt) list = list.filter(d => status(d.id) === filt);
    const grid = el('div','grid');
    list.forEach(d => grid.appendChild(card(d)));
    if (!list.length) grid.appendChild(el('div','empty','لا أسئلة هنا.'));
    box.appendChild(grid); names(grid);
  }

  async function save(id, patch, msg){
    const prev = answers[id] || {};
    const next = Object.assign({}, prev, patch, {at: new Date().toISOString()});
    if (myId) next.by = myId;
    answers[id] = next; saveLocal(); draw();
    if (db && !readOnly){
      try { const body = {}; Object.keys(next).forEach(k => { if (next[k] !== undefined && next[k] !== null && next[k] !== '') body[k] = next[k]; }); await db.collection('answers').doc(id).set(body); toast(msg); }
      catch(e){ if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')) setReadOnly(); else toast('لم نتمكن من الحفظ الآن. احتفظنا به على هذا الجهاز.'); }
    } else toast('احتفظنا باختياركم على هذا الجهاز');
  }
  async function clear(id){
    delete answers[id]; saveLocal(); draw();
    if (db && !readOnly){ try { await db.collection('answers').doc(id).delete(); toast('مسحنا الاختيار'); } catch(e){ toast('لم نتمكن من المسح الآن'); } }
  }
  function setReadOnly(){
    readOnly = true; const m = $('#mode'); m.hidden = false;
    m.textContent = 'لديكم صلاحية اطلاع فقط. نحتفظ باختياراتكم على هذا الجهاز. انسخوا الملخص وأرسلوه لنا، أو اطلبوا صلاحية تحرير.';
  }

  $('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filt = b.dataset.f; $('#seg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x===b))); draw(); });
  $('#q').addEventListener('input', draw);
  $('#copyAll').addEventListener('click', () => {
    const lines = ['قرارات منصة التكافل · ' + new Date().toLocaleDateString('ar-LY'), ''];
    mods.forEach(m => { const ds = (m.decisions||[]).filter(d => answers[d.id]); if (!ds.length) return; lines.push('■ ' + m.name_ar);
      ds.forEach(d => { const a = answers[d.id]; const o = (d.options||[]).find(x => x.key === a.choice);
        lines.push(d.id + ' · ' + d.title_ar + ': ' + (a.status==='discuss' ? 'للنقاش' : o ? a.choice + '. ' + o.label_ar : '—') + (a.note ? ' | ' + a.note : '')); }); lines.push(''); });
    const text = lines.join('\n');
    const fb = () => { const t = el('textarea'); t.value = text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('نسخنا الملخص'); } catch(e){ toast('حددوا النص وانسخوه'); } t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('نسخنا الملخص'), fb); else fb();
  });

  draw();
  (async () => {
    if (!window.claude || !window.claude.use){ setReadOnly(); return; }
    try { user = await window.claude.use('user'); } catch(e){ user = null; }
    try { db = await window.claude.use('db'); } catch(e){ db = null; }
    let canWrite = null;
    if (user){ try { myId = await user.id(); canWrite = await user.can('data.write'); } catch(e){} }
    if (!db || canWrite === false) setReadOnly();
    if (!db) return;
    db.collection('answers').onSnapshot(snap => {
      const remote = {}; snap.docs.forEach(d => { if (d.exists) remote[d.id] = Object.assign({}, d.data()); });
      answers = readOnly ? Object.assign({}, remote, answers) : remote;
      if (!readOnly) saveLocal();
      const focused = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
      if (!focused) draw(); else { tabs(); progress(); }
    }, () => setReadOnly());
  })();
})();
</script>
